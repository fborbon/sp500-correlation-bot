# Required GitHub secrets:
#   EC2_HOST    — public IP or hostname of the EC2 instance
#   EC2_USER    — SSH user (e.g. ubuntu)
#   EC2_SSH_KEY — private key whose public key is in EC2 ~/.ssh/authorized_keys

name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Pull, rebuild image, restart container on EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            if [ ! -d /opt/forwardforecasting/.git ]; then
              mkdir -p /opt/forwardforecasting
              cd /opt/forwardforecasting
              git init
              git remote add origin https://github.com/fborbon/sp500-correlation-bot.git
            fi
            cd /opt/forwardforecasting
            OLD_REV=$(git rev-parse HEAD)
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
            docker compose ps
            # Main-site nginx config (incl. central login): drift-guarded install, see the script
            bash scripts/install_nginx.sh "$OLD_REV"
            echo "✓ SP500 bot deployed at $(date -u)"
