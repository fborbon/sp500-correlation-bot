server {
    listen 80;
    server_name forwardforecasting.eu www.forwardforecasting.eu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name forwardforecasting.eu www.forwardforecasting.eu;

    ssl_certificate     /etc/letsencrypt/live/forwardforecasting.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forwardforecasting.eu/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/forwardforecasting;
    index index.html;

    # Central login (Authelia): portal + internal check endpoint
    include snippets/authelia-portal.conf;
    include snippets/authelia-location.conf;

    location = / { try_files /index.html =404; }
    location = /logo.png { try_files /logo.png =404; }

    location /SP500bot {
        proxy_pass         http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    location /facial-recognition {
        alias /var/www/forwardforecasting/facial-recognition;
        index index.html;
        try_files $uri $uri/ /facial-recognition/index.html =404;
    }

    location /taxes {
        alias /var/www/forwardforecasting/taxes;
        index index.html;
        try_files $uri $uri/ /taxes/index.html =404;
    }

    location /music-spectra {
        alias /var/www/forwardforecasting/music-spectra;
        index index.html;
        try_files $uri $uri/ /music-spectra/index.html =404;
    }

    include snippets/globalnews-nocache.conf;
    include snippets/traffic-analytics-nocache.conf;

    location /traffic-analytics {
        include snippets/authelia-authrequest.conf;
        alias /var/www/forwardforecasting/traffic-analytics;
        index index.html;
        try_files $uri $uri/ /traffic-analytics/index.html =404;
    }

    location /visitors {
        rewrite ^/visitors(.*)$ /traffic-analytics$1 permanent;
    }

    location /cv-builder {
        alias /var/www/forwardforecasting/cv-builder;
        index index.html;
        try_files $uri $uri/ /cv-builder/index.html =404;
    }

    # Photo Visor JSON data — no browser cache so updates are immediate
    location ~* ^/photo-visor/index/.*\.json$ {
        root /var/www/forwardforecasting;
        add_header Cache-Control 'no-store, no-cache, must-revalidate';
        add_header Pragma 'no-cache';
        try_files $uri =404;
    }

    location /photo-visor {
        alias /var/www/forwardforecasting/photo-visor;
        index index.html;
        try_files $uri $uri/ /photo-visor/index.html =404;
    }

    location /DeePower { return 302 /; }

    # Social Pulse was retired as a stand-alone service (2026-10-17); its posts, daily briefings and
    # AI search now live in Global News' Social Pulse tab, so old links land there.
    location ^~ /social-pulse { return 301 /global-news-agent/index.html#tab-social; }

    location /emotion-analyzer {
        alias /var/www/forwardforecasting/emotion-analyzer;
        index index.html;
        try_files $uri $uri/ /emotion-analyzer/index.html =404;
    }

    location /music-energy-analyzer {
        alias /var/www/forwardforecasting/music-energy-analyzer;
        index index.html;
        try_files $uri $uri/ /music-energy-analyzer/index.html =404;
    }

    location /my-country-tax-breakdown {
        alias /var/www/forwardforecasting/my-country-tax-breakdown;
        index index.html;
        try_files $uri $uri/ /my-country-tax-breakdown/index.html =404;
    }

    location /pacman-dqn-player {
        alias /var/www/forwardforecasting/pacman-dqn-player;
        index index.html;
        try_files $uri $uri/ /pacman-dqn-player/index.html =404;
    }

    location /cloud-drive {
        alias /var/www/forwardforecasting/cloud-drive;
        index index.html;
        try_files $uri $uri/ /cloud-drive/index.html =404;
    }

    location /finance-dashboard {
        alias /var/www/forwardforecasting/finance-dashboard;
        index index.html;
        try_files $uri $uri/ /finance-dashboard/index.html =404;
    }
}
